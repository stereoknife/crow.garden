when:
  - event: push
    branch: main

engine: microvm
image: alpine

environment:
  GH_USER: "stereoknife"

clone:
    skip: true

steps:
  - name: "Clone repo"
    command: "git clone --bare \"${TANGLED_REPO_URL}\" ${TANGLED_REPO_NAME} && cd ${TANGLED_REPO_NAME}"
  - name: "Config"
    command: "git config --global --add safe.directory ${PWD}"
  - name: "Add remote"
    command: "git remote add gh \"https://${GH_USER}:${GH_TOKEN}@github.com/${GH_USER}/${TANGLED_REPO_NAME}\""
  - name: "Push"
    command: "git push gh --force --mirror --prune"
